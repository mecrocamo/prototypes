<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Prototypes</title>
<meta name="description" content="Ongoing design prototypes, newest first.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400&family=Dela+Gothic+One&family=Fragment+Mono&family=Inter:opsz,wght@14..32,300;14..32,500;14..32,600;14..32,900&display=swap">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/prefs.js"></script>
<style>
  /* ---- masthead ---- */
  h1{font-weight:var(--w-h1);font-size:60px;line-height:1;letter-spacing:-.01em;text-wrap:balance}
  .lede{font-family:var(--f-serif);font-size:var(--lede-size);letter-spacing:var(--serif-spacing);line-height:1.5;
    color:var(--ink-2);max-width:52ch;margin-top:18px}

  /* ---- list ---- */
  .count{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-2);margin-top:44px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
  .card{position:relative;display:flex;flex-direction:column;text-decoration:none;overflow:hidden;
    background:var(--panel);border-radius:var(--radius);padding:30px 28px 24px;
    box-shadow:var(--shadow);
    transition:transform .2s ease, box-shadow .2s ease, background-color .2s ease}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--c-trim)}
  /* hover outline drawn as an inset shadow so no border gap shows around the trim */
  .card:hover{transform:translateY(-4px);background:var(--panel-hover);
    box-shadow:var(--shadow-lift), inset 0 0 0 1.5px var(--c-trim)}

  /* Archived section: quieter cards filled halfway between the page and an active card,
     so the same rule works in both themes and both modes */
  .archive{margin-top:24px}
  .archive .count{margin-top:40px}
  .card.is-archived{background:var(--bg);background:color-mix(in srgb, var(--panel) 50%, var(--bg));
    box-shadow:inset 0 0 0 1px var(--line)}
  .card.is-archived:hover{background:var(--panel-hover);box-shadow:var(--shadow-lift), inset 0 0 0 1.5px var(--c-trim)}

  .kicker{align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--c-ink);background:var(--c);border-radius:36px;padding:6px 12px}

  .card h2{font-weight:var(--w-h2);font-size:32px;line-height:1.1;letter-spacing:-.01em;margin-top:22px;text-wrap:balance}
  .card p{font-family:var(--f-serif);font-size:var(--desc-size);letter-spacing:var(--serif-spacing);line-height:1.45;
    color:var(--ink-2);margin-top:12px;flex:1}

  .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:24px}
  .go{display:inline-flex;align-items:center;gap:8px;flex-shrink:0;
    font-size:14px;font-weight:600;color:var(--btn-ink);background:var(--btn);
    border-radius:100px;padding:9px 16px}

  /* topic tags — quiet mono labels (Fragment Mono, as on marycrocamo.com) */
  /* every tag gets a leading "·"; the list is shifted left by one dot's width and the
     footer clips it, so the dot at the start of each line is hidden when tags wrap */
  .foot{overflow:hidden}
  .tags{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;list-style:none;padding-bottom:9px;
    margin-left:-18px;min-width:0}
  .tag{font-family:var(--f-mono);font-size:var(--tag-size);font-weight:var(--w-tag);
    letter-spacing:var(--tag-spacing);text-transform:var(--tag-case);color:var(--ink-3)}
  .tag{white-space:nowrap}
  .tag::before{content:"·";display:inline-block;width:18px;text-align:center}
  .go svg{transition:transform .2s ease}
  .card:hover .go svg{transform:translateX(3px)}

  .periwinkle{--c:var(--periwinkle);--c-trim:var(--periwinkle-trim);--c-ink:var(--periwinkle-ink)}
  .coral{--c:var(--coral);--c-trim:var(--coral-trim);--c-ink:var(--coral-ink)}
  .marigold{--c:var(--marigold);--c-trim:var(--marigold-trim);--c-ink:var(--marigold-ink)}
  .blush{--c:var(--blush);--c-trim:var(--blush-trim);--c-ink:var(--blush-ink)}



  @media (max-width:760px){
    h1{font-size:44px}
    .lede{font-size:19px}
    .count{margin-top:44px}
    .cards{grid-template-columns:1fr;gap:16px}
    .card{padding:24px 20px 20px}
    .card h2{font-size:28px}
    .card p{font-size:calc(var(--desc-size) - 1px)}
  }
</style>
</head>
<body>
  <header class="nav">
    <a class="wordmark" href="./">MARY CROCAMO<span class="sub">WORKBENCH</span></a>
    <button class="toolbtn" id="themeBtn" type="button">◑ Theme</button>
  </header>

  <main class="wrap">
    <h1>Design Prototypes</h1>
    <p class="lede">Home for ongoing design prototypes. Everything here is an unfinished work in progress.</p>

    <div class="count" id="count"></div>
    <div class="cards" id="cards"></div>

    <section class="archive" id="archive" hidden>
      <h2 class="count" id="archiveCount"></h2>
      <div class="cards" id="archiveCards"></div>
    </section>
  </main>

  <footer class="pagefoot">
    <button class="stylelink" id="styleBtn" type="button">PBS-ify this page</button>
  </footer>

  <script>
    /*
      ADD A PROTOTYPE: add one entry to this list. Order doesn't matter;
      the page sorts by date, newest first. The date isn't shown.
        date   — "YYYY-MM-DD", used only for ordering
        title  — card heading
        kicker — the one product category (e.g. "CTV", "Consoles")
        color  — the category's color: "periwinkle", "coral", "marigold" or "blush".
                 Keep each product on the same color.
        href   — a folder in this repo (e.g. "my-prototype/") or a full URL
        desc   — one or two sentences
        tags   — any number of topic tags, e.g. ["Motion", "Navigation"]
        archived — optional; true moves the card to the Archived section
    */
    var PROTOTYPES = [
      {
        date: "2026-07-20",
        title: "TeamCraft + Design Skills",
        kicker: "Design Ops",
        color: "marigold",
        href: "https://mecrocamo.github.io/starman-mary/teamcraft.html",
        desc: "The end-to-end team workflow, mapped across six phases from team setup through continuous improvement: the existing TeamCraft skills plus the proposed design skills.",
        tags: ["Workflow", "Skills"],
        archived: true
      },
      {
        date: "2026-08-01",
        title: "Design Versioning Playbook",
        kicker: "Design Ops",
        color: "marigold",
        href: "https://mecrocamo.github.io/starman-mary/versioning.html",
        desc: "How the design team names, saves, branches, and hands off work in Figma: file structure, named versions, branching rules, annotations, and a 30-day rollout.",
        tags: ["Workflow", "Standards"]
      },
      {
        date: "2026-07-22",
        title: "CTV Screen-Reader Style Guide",
        kicker: "CTV",
        color: "periwinkle",
        href: "tts-guidelines/",
        desc: "Screen-reader and text-to-speech rules for connected TV apps, written to WCAG 2.2 AA: core rules, component patterns, platform notes, a per-screen checklist, and a test template.",
        tags: ["Accessibility", "Standards"],
        archived: true
      },
      {
        date: "2026-07-25",
        title: "VPPA Consent Modal",
        kicker: "CTV",
        color: "periwinkle",
        href: "https://mecrocamo.github.io/starman-mary/vppa-consent-modal/",
        desc: "The CTV privacy-consent modal built as one source of truth, with design tokens and a component spec that port to HTML smart TVs, tvOS, Android TV, and Roku.",
        tags: ["Workflow", "Design Systems"],
        archived: true
      },
      {
        date: "2026-08-06",
        title: "Moods in Media Manager",
        kicker: "Consoles",
        color: "coral",
        href: "https://mecrocamo.github.io/personalization/",
        desc: "V2 mockups for adding moods to shows in the PBS Console's Media Manager: core data and moods, auto-applied details, and editing moods, with pattern notes.",
        tags: ["Personalization"]
      },
      {
        date: "2026-11-20",
        title: "CTV Hero Motion Comparison",
        kicker: "CTV",
        color: "periwinkle",
        href: "hero-motion-comparison/",
        desc: "Crossfade vs. slide transitions for the CTV home hero carousel at 1920×1080. Watch them side by side or one at a time, with auto-advance and the timing for each.",
        tags: ["Motion"]
      }
    ];

    (function(){
      function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
      var arrow='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

      function card(p){
        return '<a class="card '+esc(p.color||"periwinkle")+(p.archived?' is-archived':'')+'" href="'+esc(p.href)+'">'+
          '<span class="kicker">'+esc(p.kicker)+'</span>'+
          '<h2>'+esc(p.title)+'</h2><p>'+esc(p.desc)+'</p>'+
          '<div class="foot"><ul class="tags">'+(p.tags||[]).map(function(t){ return '<li class="tag">'+esc(t)+'</li>'; }).join("")+'</ul>'+
          '<span class="go" aria-hidden="true">Open '+arrow+'</span></div></a>';
      }
      var sorted=PROTOTYPES.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
      var active=sorted.filter(function(p){ return !p.archived; });
      var archived=sorted.filter(function(p){ return p.archived; });

      document.getElementById("count").textContent=active.length+(active.length===1?" prototype":" prototypes")+" · newest first";
      document.getElementById("cards").innerHTML=active.map(card).join("");
      if(archived.length){
        document.getElementById("archiveCount").textContent="Archived · "+archived.length;
        document.getElementById("archiveCards").innerHTML=archived.map(card).join("");
        document.getElementById("archive").hidden=false;
      }
    })();
  </script>
  <script src="assets/site.js"></script>
</body>
</html>
